[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-dehaze"
version = "0.1.0"
description = "Traditional and machine-learning image dehazing research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "scikit-image>=0.22",
  "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
detection = [
  "ultralytics>=8.3",
  "pycocotools>=2.0.7",
]
training = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
