dataset:
  root: rtts/test
  split: test

detector:
  weights: yolov8n.pt
  pretrained: COCO
  frozen: true
  image_size: 640
  confidence: 0.001
  nms_iou: 0.7
  max_detections: 300
  batch_size: 8
  device: auto
  classes:
    bicycle: 1
    bus: 5
    car: 2
    motorbike: 3
    person: 0

evaluation:
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  max_detections_per_image: 100

dcp:
  patch_size: 15
  omega: 0.95
  atmospheric_top_fraction: 0.001
  guided_radius: 20
  guided_epsilon: 0.001
  transmission_floor: 0.1
